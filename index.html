<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YANZ STOR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0a0a0a;
      color: white;
      overflow-x: hidden;
    }

    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    header img {
      width: 280px;
      border-radius: 20px;
      opacity: 0;
      transform: scale(0.8);
      animation: fadeIn 2s ease forwards;
      animation-delay: 0.8s;
    }

    header h1 {
      font-size: 2.5em;
      color: #b800ff;
      opacity: 0;
      transform: translateX(100%);
      animation: slideIn 2s ease forwards;
      animation-delay: 1.5s;
      margin-top: 20px;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    section {
      padding: 60px 20px;
      background: #111;
      min-height: 100vh;
    }

    h2 {
      text-align: center;
      color: #b800ff;
      margin-bottom: 30px;
    }

    .produk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px #b800ff44;
    }

    .card h3 {
      color: #fff;
      margin-bottom: 10px;
    }

    .price {
      color: #b800ff;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background: #b800ff;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s;
      margin: 5px;
    }

    .btn:hover {
      background: #7a00b3;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #0a0a0a;
      border-top: 1px solid #333;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://files.catbox.moe/4l7s2x.jpg" alt="YANZ SHADOW" />
    <h1>WELCOME TO YANZ STOR</h1>
  </header>

  <section>
    <h2>🔥 MENU JUALAN PANEL 🔥</h2>
    <div class="produk-grid" id="panel-list"></div>
  </section>

  <section>
    <h2>💀 SCRIPT BUG WA 💀</h2>
    <div class="produk-grid" id="script-list"></div>
  </section>

  <footer>
    © 2025 YANZ STOR | All Rights Reserved
  </footer>

  <script>
    const waNumber = "6285719253841";
    const telegramUser = "yanztiandi";

    const panels = [
      { name: "Panel RAM 1 GB", price: "Rp 1.000" },
      { name: "Panel RAM 2 GB", price: "Rp 2.000" },
      { name: "Panel RAM 3 GB", price: "Rp 3.000" },
      { name: "Panel RAM 4 GB", price: "Rp 4.000" },
      { name: "Panel RAM 5 GB", price: "Rp 5.000" },
      { name: "Panel RAM 6 GB", price: "Rp 6.000" },
      { name: "Panel RAM 7 GB", price: "Rp 7.000" },
      { name: "Panel RAM 8 GB", price: "Rp 8.000" },
      { name: "Panel RAM 9 GB", price: "Rp 9.000" },
      { name: "Panel RAM 10 GB", price: "Rp 10.000" },
      { name: "PANEL UNLIMITED", price: "Rp 5.000" },
      { name: "AKSES PANEL", price: "Rp 6.000" },
      { name: "ADMIN PANEL", price: "Rp 8.000" },
      { name: "PT PANEL", price: "Rp 10.000" },
      { name: "OWNER PANEL", price: "Rp 12.000" },
    ];

    const scripts = [
      { name: "HIDEUNG CRASH (ENC)", price: "Hubungi Admin" },
      { name: "HIDEUNG CRASH (NO ENC)", price: "Hubungi Admin" },
    ];

    const panelContainer = document.getElementById("panel-list");
    const scriptContainer = document.getElementById("script-list");

    function makeCard(item) {
      const msg = encodeURIComponent(`Bang Yanz, mau buy ${item.name}`);
      return `
        <div class="card">
          <h3>${item.name}</h3>
          <p class="price">${item.price}</p>
          <a href="https://wa.me/${waNumber}?text=${msg}" target="_blank" class="btn">Buy via WhatsApp</a>
          <a href="https://t.me/${telegramUser}" target="_blank" class="btn">Buy via Telegram</a>
        </div>
      `;
    }

    panelContainer.innerHTML = panels.map(makeCard).join("");
    scriptContainer.innerHTML = scripts.map(makeCard).join("");
  </script>
</body>
</html>
