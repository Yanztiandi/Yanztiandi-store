<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YANZ SHADOW STORE</title>
  <style>
    /* FONT & BASE */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(circle at top left, #000 40%, #1a001a);
      color: white;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      perspective: 1000px;
    }

    /* HOLOGRAM PARTICLES */
    .holo {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://i.ibb.co/ZfLxH3f/nebula-purple.gif');
      background-size: cover;
      opacity: 0.25;
      z-index: -1;
      animation: floatBg 20s infinite alternate ease-in-out;
      filter: blur(4px) saturate(1.4);
    }

    @keyframes floatBg {
      0% { background-position: 0 0; transform: scale(1); }
      100% { background-position: 100% 100%; transform: scale(1.1); }
    }

    /* FLOATING PARTICLES */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      width: 6px; height: 6px;
      background: rgba(200, 100, 255, 0.7);
      border-radius: 50%;
      animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      30% { opacity: 1; transform: translateY(70vh) scale(1); }
      100% { transform: translateY(-10vh) scale(0.8); opacity: 0; }
    }

    /* LOGO */
    .logo {
      width: 220px;
      margin-top: 50px;
      border-radius: 20px;
      box-shadow: 0 0 30px #a020f0;
      animation: rotate3D 8s infinite linear, pulseGlow 3s infinite ease-in-out;
    }

    @keyframes rotate3D {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    /* TITLE */
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 45px;
      margin-top: 20px;
      color: #c77dff;
      text-shadow: 0 0 20px #b400ff, 0 0 40px #ff00ff;
      animation: neonPulse 3s infinite alternate, floatTitle 4s ease-in-out infinite;
    }

    @keyframes neonPulse {
      0% { text-shadow: 0 0 10px #b400ff; }
      100% { text-shadow: 0 0 25px #ff00ff, 0 0 45px #a020f0; }
    }

    @keyframes floatTitle {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* PRODUCT CARD */
    .product {
      background: rgba(20, 0, 30, 0.7);
      backdrop-filter: blur(10px);
      margin: 20px auto;
      padding: 15px;
      width: 90%;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 0 20px #7a00cc;
      transition: 0.4s;
      animation: pulseCard 3s infinite ease-in-out;
    }

    .product:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px #d28cff;
    }

    @keyframes pulseCard {
      0%,100% { box-shadow: 0 0 15px #7a00cc; }
      50% { box-shadow: 0 0 35px #b266ff; }
    }

    .product h3 {
      color: #d0aaff;
      margin: 0;
      font-family: 'Orbitron', sans-serif;
    }

    .price {
      color: #fff;
      font-size: 18px;
      margin: 5px 0;
    }

    .buy-btn {
      background-color: #6a0dad;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Orbitron', sans-serif;
    }

    .buy-btn:hover {
      background-color: #9b30ff;
      transform: scale(1.1);
      box-shadow: 0 0 15px #c77dff;
    }

    footer {
      margin: 40px 0 20px;
      color: #999;
      font-size: 14px;
    }

    a { color: #b366ff; text-decoration: none; }
  </style>
</head>
<body>

  <div class="holo"></div>
  <div class="particles" id="particles"></div>

  <center>
    <img src="yanz-shadow.png" alt="YANZ SHADOW" class="logo">
    <h1>WELCOME TO YANZ STOR</h1>
  </center>

  <div id="menu"></div>

  <footer>
    © 2025 YANZ SHADOW | 
    <a href="https://wa.me/6285719253841">WhatsApp</a> • 
    <a href="https://t.me/yanztiandi">Telegram</a>
  </footer>

  <script>
    const products = [
      {name:"Panel Hosting RAM 1 GB", price:"Rp 1.000"},
      {name:"Panel Hosting RAM 2 GB", price:"Rp 2.000"},
      {name:"Panel Hosting RAM 3 GB", price:"Rp 3.000"},
      {name:"Panel Hosting RAM 4 GB", price:"Rp 4.000"},
      {name:"Panel Hosting RAM 5 GB", price:"Rp 5.000"},
      {name:"Panel Hosting RAM 6 GB", price:"Rp 6.000"},
      {name:"Panel Hosting RAM 7 GB", price:"Rp 7.000"},
      {name:"Panel Hosting RAM 8 GB", price:"Rp 8.000"},
      {name:"Panel Hosting RAM 9 GB", price:"Rp 9.000"},
      {name:"Panel Hosting RAM 10 GB", price:"Rp 10.000"},
      {name:"Panel Unlimited", price:"Rp 5.000"},
      {name:"Akses Panel", price:"Rp 6.000"},
      {name:"Reseller Panel", price:"Rp 6.000"},
      {name:"Admin Panel", price:"Rp 8.000"},
      {name:"PT Panel", price:"Rp 10.000"},
      {name:"Owner Panel", price:"Rp 12.000"},
      {name:"SC BUG WA HIDEUNG CRASH (ENC)", price:"-"},
      {name:"SC BUG WA HIDEUNG CRASH (NO ENC)", price:"-"}
    ];

    const menu = document.getElementById('menu');
    products.forEach(p => {
      menu.innerHTML += `
        <div class="product">
          <h3>${p.name}</h3>
          <p class="price">${p.price}</p>
          <button class="buy-btn" onclick="buy('${p.name} - ${p.price}')">BUY</button>
        </div>
      `;
    });

    function buy(item) {
      const msg = encodeURIComponent(`Bang Yanz mau buy ${item}`);
      const wa = `https://wa.me/6285719253841?text=${msg}`;
      const tg = `https://t.me/yanztiandi`;
      const choose = confirm("Kirim via WhatsApp? (OK = WhatsApp / Cancel = Telegram)");
      if (choose) window.open(wa, '_blank');
      else window.open(tg, '_blank');
    }

    // Buat efek partikel acak
    const particleContainer = document.getElementById('particles');
    for(let i=0; i<30; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random()*100+'%';
      p.style.animationDelay = Math.random()*8+'s';
      particleContainer.appendChild(p);
    }
  </script>
</body>
</html>
